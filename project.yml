name: TVPilot
options:
  bundleIdPrefix: com.adamly218
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J7Y4HL27S4
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TVPilot:
    type: application
    platform: iOS
    sources: [TVPilot]
    info:
      path: TVPilot/Support/Info.plist
      properties:
        CFBundleDisplayName: TV Pilot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: TV Pilot looks for your TV on this Wi-Fi network and sends remote commands to it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamly218.tvpilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
